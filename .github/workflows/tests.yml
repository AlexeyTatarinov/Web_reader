name: Tests

# Runs the test suite on every pull request and on pushes to main (results commits are skipped).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "results/**"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q
