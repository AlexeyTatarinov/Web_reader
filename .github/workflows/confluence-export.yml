name: Confluence export

# Manual run only. Reads one branch of a Confluence Cloud space (read-only REST API) and saves it as Markdown.
# The result is kept as a workflow artifact for 3 days; nothing is committed to the repository.
on:
  workflow_dispatch:
    inputs:
      root_id:
        description: "Id of the root page of the branch"
        required: true
      site:
        description: "Confluence Cloud site, e.g. example.atlassian.net"
        required: true

concurrency:
  group: confluence-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Export branch to Markdown
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          ROOT_ID: ${{ github.event.inputs.root_id }}
          SITE: ${{ github.event.inputs.site }}
        run: python -m web_reader confluence-export --root-id "$ROOT_ID" --site "$SITE" --out "$RUNNER_TEMP/export"

      - name: Keep the Markdown files (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: confluence-export
          path: ${{ runner.temp }}/export/
          retention-days: 3
