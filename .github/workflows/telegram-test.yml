name: Telegram test

# Manual run only. Sends one test message from the login bot to the owner's chat and prints the bot's name.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send test message
        env:
          LOGIN_TELEGRAM_BOT_TOKEN: ${{ secrets.LOGIN_TELEGRAM_BOT_TOKEN }}
          LOGIN_TELEGRAM_CHAT_ID: ${{ secrets.LOGIN_TELEGRAM_CHAT_ID }}
        run: python -m web_reader telegram-test
